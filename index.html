<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Preview</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            width: 100%;
            height: 100%;
            background-color: #000; /* Dark background to easily highlight image bounds */
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        .preview-img {
            max-width: 100%;
            max-height: 100vh;
            object-fit: contain;
            display: block;
        }
    </style>
</head>
<body>

    <img src="images/Sreenu4Cherry_2.png" alt="Cover Artwork" class="preview-img">

</body>
</html>
