<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Wedding Invitation | Sreenu & Cherry</title>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Great+Vibes&family=Montserrat:wght@400;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --royal-maroon: #6A0B12;
            --white: #ffffff;
            --cream: #fffdf8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Montserrat', sans-serif;
            background-color: var(--cream);
        }

        /* --- Fullscreen Artwork Cover Screen --- */
        #cover-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: var(--cream);
            background-image: url('images/Sreenu4Cherry_2.png');
            background-position: center center;
            background-size: cover;
            background-repeat: no-repeat;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
            color: var(--royal-maroon);
            padding: calc(env(safe-area-inset-top) + 5vh) 20px calc(env(safe-area-inset-bottom) + 4vh);
            text-align: center;
            transition: transform 0.8s ease-in-out, opacity 0.8s ease-in-out;
        }

        /* Top Title Header */
        .cover-header-title {
            font-family: 'Cinzel', serif;
            font-size: clamp(1.4rem, 4.5vw, 2.2rem);
            font-weight: 700;
            letter-spacing: 3px;
            color: var(--royal-maroon);
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.9), 1px 1px 2px rgba(255, 255, 255, 0.8);
            text-transform: uppercase;
        }

        /* Flexible Spacer */
        .cover-middle-spacer {
            flex-grow: 1;
        }

        /* Bottom Section Wrapper */
        .cover-bottom-content {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Couple Script Names */
        .couple-cover-name {
            font-family: 'Great Vibes', cursive;
            font-size: clamp(2.8rem, 8vw, 3.8rem);
            font-weight: 600;
            color: var(--royal-maroon);
            text-shadow: 0 0 12px rgba(255, 255, 255, 0.95), 1px 1px 2px rgba(255, 255, 255, 0.8);
            margin-bottom: 2vh;
        }

        /* Bouncing Hand Icon */
        .hand-pointer {
            font-size: 1.5rem;
            margin-bottom: 8px;
            animation: bounce 1.2s infinite ease-in-out;
            user-select: none;
            filter: drop-shadow(0 2px 4px rgba(255,255,255,0.8));
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }

        /* Action Button */
        .tap-btn {
            background: var(--royal-maroon);
            color: var(--white);
            border: 2px solid #E0E0E0;
            padding: 14px 40px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 30px;
            letter-spacing: 2px;
            text-transform: uppercase;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(106, 11, 18, 0.4);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .tap-btn:active {
            transform: scale(0.95);
        }

        /* Hidden class for smooth slide up */
        .hide-cover {
            transform: translateY(-100%);
            opacity: 0;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <!-- LANDING / COVER PAGE -->
    <div id="cover-screen">
        <div class="cover-header-title">WEDDING INVITE</div>
        
        <div class="cover-middle-spacer"></div>

        <div class="cover-bottom-content">
            <div class="couple-cover-name">Sreenu & Cherry</div>

            <div class="hand-pointer">👇</div>
            <button class="tap-btn" onclick="openInvitation()">TAP TO OPEN</button>
        </div>
    </div>

    <script>
        function openInvitation() {
            const cover = document.getElementById('cover-screen');
            cover.classList.add('hide-cover');
        }
    </script>
</body>
</html>
